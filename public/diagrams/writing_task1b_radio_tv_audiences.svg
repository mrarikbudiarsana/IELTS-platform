<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="100%" height="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="780" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">
    Radio and television audiences in UK, October – December 1992
  </text>

  <!-- Y-Axis Label -->
  <g transform="translate(28, 225) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-size="13" fill="#0f172a">
      Percentage of UK population (over 4 years old)
    </text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(210, 55)">
    <rect x="0" y="0" width="175" height="54" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="14" y1="18" x2="84" y2="18" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="14,6"/>
    <text x="94" y="23" font-size="14" fill="#0f172a">Television</text>
    <line x1="14" y1="38" x2="84" y2="38" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="5,5"/>
    <text x="94" y="43" font-size="14" fill="#0f172a">Radio</text>
  </g>

  <!-- Gridlines (50% = y:90, 40% = y:144, 30% = y:198, 20% = y:252, 10% = y:306, 0% = y:360) -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3">
    <line x1="100" y1="90" x2="730" y2="90"/>
    <line x1="100" y1="144" x2="730" y2="144"/>
    <line x1="100" y1="198" x2="730" y2="198"/>
    <line x1="100" y1="252" x2="730" y2="252"/>
    <line x1="100" y1="306" x2="730" y2="306"/>
  </g>

  <!-- Axes -->
  <line x1="100" y1="65" x2="100" y2="360" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="100" y1="360" x2="735" y2="360" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Y-Axis Ticks & Labels -->
  <g stroke="#0f172a" stroke-width="2">
    <line x1="93" y1="90" x2="100" y2="90"/>
    <line x1="93" y1="144" x2="100" y2="144"/>
    <line x1="93" y1="198" x2="100" y2="198"/>
    <line x1="93" y1="252" x2="100" y2="252"/>
    <line x1="93" y1="306" x2="100" y2="306"/>
    <line x1="93" y1="360" x2="100" y2="360"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="end">
    <text x="88" y="95">50%</text>
    <text x="88" y="149">40%</text>
    <text x="88" y="203">30%</text>
    <text x="88" y="257">20%</text>
    <text x="88" y="311">10%</text>
    <text x="88" y="365">0%</text>
  </g>

  <!-- X-Axis Ticks & Labels (13 points from 6:00 AM to 6:00 AM, step = 52px: 100, 152, 204, 256, 308, 360, 412, 464, 516, 568, 620, 672, 724) -->
  <g stroke="#0f172a" stroke-width="2">
    <line x1="100" y1="360" x2="100" y2="370"/>
    <line x1="152" y1="360" x2="152" y2="370"/>
    <line x1="204" y1="360" x2="204" y2="370"/>
    <line x1="256" y1="360" x2="256" y2="370"/>
    <line x1="308" y1="360" x2="308" y2="370"/>
    <line x1="360" y1="360" x2="360" y2="370"/>
    <line x1="412" y1="360" x2="412" y2="370"/>
    <line x1="464" y1="360" x2="464" y2="370"/>
    <line x1="516" y1="360" x2="516" y2="370"/>
    <line x1="568" y1="360" x2="568" y2="370"/>
    <line x1="620" y1="360" x2="620" y2="370"/>
    <line x1="672" y1="360" x2="672" y2="370"/>
    <line x1="724" y1="360" x2="724" y2="370"/>
  </g>

  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="100" y="388">6 00</text>
    <text x="152" y="388">8 00</text>
    <text x="204" y="388">10 00</text>
    <text x="256" y="388">12 00</text>
    <text x="256" y="405">Noon</text>
    <text x="308" y="388">2 00</text>
    <text x="360" y="388">4 00</text>
    <text x="412" y="388">6 00</text>
    <text x="464" y="388">8 00</text>
    <text x="516" y="388">10 00</text>
    <text x="568" y="388">12 00</text>
    <text x="568" y="405">Midnight</text>
    <text x="620" y="388">2 00</text>
    <text x="672" y="388">4 00</text>
    <text x="724" y="388">6 00</text>
    <text x="412" y="432" font-size="14" font-weight="bold">Time of day or night</text>
  </g>

  <!-- RADIO CURVE (Dotted Line): 6am=7%(322), 8am=27%(214), 10am=21%(246), 12pm=17%(268), 2pm=13%(290), 4pm=14%(284), 6pm=9%(311), 8pm=7%(322), 10pm=6%(327), 12am=5%(333), 2am=2%(349), 4am=2%(349), 6am=4%(338) -->
  <polyline
    fill="none"
    stroke="#0f172a"
    stroke-width="2.8"
    stroke-dasharray="5,5"
    points="100,322 126,260 152,214 178,236 204,246 256,268 308,290 334,295 360,284 386,294 412,311 464,322 516,327 542,324 568,333 620,349 672,349 724,338"
  />

  <!-- TELEVISION CURVE (Long-Dashed Line): 6am=1%(355), 8am=7%(322), 10am=6%(327), 11am=4%(338), 12pm=5%(333), 1pm=14%(284), 2pm=15%(279), 3pm=14%(284), 4pm=20%(252), 6pm=41%(138), 8pm=46%(111), 9pm=45%(117), 10pm=38%(155), 12am=15%(279), 2am=2%(349), 4am=1%(355), 6am=3%(344) -->
  <polyline
    fill="none"
    stroke="#0f172a"
    stroke-width="2.8"
    stroke-dasharray="15,6"
    points="100,355 126,330 152,322 178,324 204,327 230,338 256,333 282,284 308,279 334,284 360,252 386,200 412,138 438,130 464,111 490,117 516,155 542,210 568,279 594,328 620,349 672,355 724,344"
  />
</svg>
