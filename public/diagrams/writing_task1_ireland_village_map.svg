<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>

  <!-- Headers -->
  <text x="215" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">2000</text>
  <text x="605" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Present</text>

  <!-- ==================== LEFT MAP: 2000 ==================== -->
  <g transform="translate(25, 45)">
    <!-- Green Land Background -->
    <rect x="0" y="0" width="380" height="365" fill="#65a30d" stroke="#0f172a" stroke-width="2"/>
    <!-- Farmland NW -->
    <path d="M 0 0 L 160 0 Q 150 65 95 85 L 0 110 Z" fill="#713f12"/>
    <text x="50" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#fef08a">Farmland</text>

    <!-- Compass Rose -->
    <g transform="translate(195, 35)">
      <circle cx="0" cy="0" r="22" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
      <polygon points="0,-18 4,0 0,-4 -4,0" fill="#ef4444"/>
      <polygon points="0,18 4,0 0,4 -4,0" fill="#f8fafc"/>
      <text x="0" y="-10" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">N</text>
    </g>

    <!-- Roads -->
    <!-- Coastal E-W Road -->
    <path d="M 0 245 L 380 205" stroke="#78716c" stroke-width="18" fill="none"/>
    <!-- Main N-S Road -->
    <path d="M 290 0 L 210 225" stroke="#78716c" stroke-width="18" fill="none"/>
    <!-- Side Road West (Housing) -->
    <path d="M 120 155 L 235 155" stroke="#78716c" stroke-width="12" fill="none"/>

    <!-- 4 Houses in 2000 -->
    <g fill="#ffffff" stroke="#0f172a" stroke-width="1.5">
      <polygon points="130,138 142,126 154,138 150,138 150,148 134,148 134,138"/>
      <polygon points="165,138 177,126 189,138 185,138 185,148 169,148 169,138"/>
      <polygon points="130,180 142,168 154,180 150,180 150,190 134,190 134,180"/>
      <polygon points="165,180 177,168 189,180 185,180 185,190 169,190 169,180"/>
    </g>
    <text x="160" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Housing</text>

    <!-- Shops (North of coastal road, west) -->
    <text x="65" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Shop</text>
    <rect x="20" y="212" width="32" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="65" y="208" width="32" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="110" y="203" width="32" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>

    <!-- Hotel (East of N-S road, North of coastal road) -->
    <text x="275" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Hotel</text>
    <rect x="255" y="185" width="42" height="22" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Market (South of coastal road) -->
    <rect x="105" y="250" width="35" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="150" y="245" width="35" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="145" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Market</text>

    <!-- Sea at bottom -->
    <path d="M 0 285 Q 190 305 380 275 L 380 365 L 0 365 Z" fill="#38bdf8"/>

    <!-- Dock -->
    <rect x="185" y="285" width="42" height="35" fill="#713f12" stroke="#0f172a" stroke-width="1.5"/>
    <text x="206" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#fef08a">Dock</text>
  </g>

  <!-- ==================== RIGHT MAP: PRESENT ==================== -->
  <g transform="translate(415, 45)">
    <!-- Green Land Background -->
    <rect x="0" y="0" width="380" height="365" fill="#65a30d" stroke="#0f172a" stroke-width="2"/>

    <!-- Park NW (Replaces Farmland) -->
    <path d="M 0 0 L 160 0 Q 150 65 95 85 L 0 110 Z" fill="#15803d"/>
    <circle cx="30" cy="30" r="10" fill="#166534"/>
    <circle cx="65" cy="55" r="12" fill="#166534"/>
    <circle cx="28" cy="70" r="10" fill="#166534"/>
    <text x="95" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Park</text>

    <!-- Compass Rose -->
    <g transform="translate(215, 35)">
      <circle cx="0" cy="0" r="22" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5"/>
      <polygon points="0,-18 4,0 0,-4 -4,0" fill="#ef4444"/>
      <polygon points="0,18 4,0 0,4 -4,0" fill="#f8fafc"/>
      <text x="0" y="-10" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">N</text>
    </g>

    <!-- Roads -->
    <!-- Coastal E-W Road -->
    <path d="M 0 245 L 380 205" stroke="#78716c" stroke-width="18" fill="none"/>
    <!-- Main N-S Road -->
    <path d="M 290 0 L 210 225" stroke="#78716c" stroke-width="18" fill="none"/>
    <!-- Extended Side Road West (10 Houses) -->
    <path d="M 40 145 L 240 145" stroke="#78716c" stroke-width="12" fill="none"/>
    <!-- New Side Road NE (3 Houses) -->
    <path d="M 275 50 L 365 85" stroke="#78716c" stroke-width="12" fill="none"/>

    <!-- 10 Houses along extended west side road -->
    <g fill="#ffffff" stroke="#0f172a" stroke-width="1.2">
      <!-- Top row (5 houses) -->
      <polygon points="45,126 55,116 65,126 62,126 62,135 48,135 48,126"/>
      <polygon points="80,126 90,116 100,126 97,126 97,135 83,135 83,126"/>
      <polygon points="115,126 125,116 135,126 132,126 132,135 118,135 118,126"/>
      <polygon points="150,126 160,116 170,126 167,126 167,135 153,135 153,126"/>
      <polygon points="185,126 195,116 205,126 202,126 202,135 188,135 188,126"/>
      <!-- Bottom row (5 houses) -->
      <polygon points="45,168 55,158 65,168 62,168 62,177 48,177 48,168"/>
      <polygon points="80,168 90,158 100,168 97,168 97,177 83,177 83,168"/>
      <polygon points="115,168 125,158 135,168 132,168 132,177 118,177 118,168"/>
      <polygon points="150,168 160,158 170,168 167,168 167,177 153,177 153,168"/>
      <polygon points="185,168 195,158 205,168 202,168 202,177 188,177 188,168"/>
    </g>
    <text x="125" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Housing</text>

    <!-- 3 New Houses in NE -->
    <g fill="#ffffff" stroke="#0f172a" stroke-width="1.2">
      <polygon points="315,52 325,42 335,52 332,52 332,62 318,62 318,52"/>
      <polygon points="290,95 300,85 310,95 307,95 307,105 293,105 293,95"/>
      <polygon points="325,105 335,95 345,105 342,105 342,115 328,115 328,105"/>
    </g>
    <text x="330" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Housing</text>

    <!-- Shops (Unchanged) -->
    <text x="65" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Shop</text>
    <rect x="20" y="212" width="32" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="65" y="208" width="32" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="110" y="203" width="32" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>

    <!-- Hotel + New Carpark East of Hotel -->
    <text x="275" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Hotel</text>
    <rect x="255" y="185" width="42" height="22" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="320" y="140" width="58" height="62" fill="#bef264" stroke="#0f172a" stroke-width="1.2"/>
    <text x="348" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Carpark</text>

    <!-- Restaurants (Replaces Market South of coastal road) -->
    <rect x="60" y="255" width="35" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="115" y="248" width="35" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <rect x="170" y="242" width="35" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="150" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Restaurants</text>

    <!-- Sea at bottom (Dock demolished) -->
    <path d="M 0 285 Q 190 305 380 275 L 380 365 L 0 365 Z" fill="#38bdf8"/>
  </g>
</svg>
