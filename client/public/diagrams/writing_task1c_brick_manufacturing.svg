<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="100%" height="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="820" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">
    Brick Manufacturing
  </text>

  <!-- Stage 1: Digger & Clay -->
  <g transform="translate(40, 70)">
    <text x="20" y="18" font-size="13" font-weight="bold" fill="#0f172a">digger</text>
    <rect x="15" y="75" width="65" height="22" rx="4" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <rect x="30" y="48" width="35" height="27" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <rect x="8" y="97" width="80" height="14" rx="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <polyline points="65,60 105,20 135,55 135,95" fill="none" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 122 95 L 152 95 L 145 112 L 118 112 Z" fill="#64748b" stroke="#0f172a" stroke-width="2"/>
    <path d="M 95 112 Q 135 104 170 115 L 170 128 L 95 128 Z" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
    <text x="75" y="148" font-size="13" font-weight="bold" fill="#0f172a">clay*</text>
    <line x1="95" y1="142" x2="122" y2="120" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 225 135 L 265 135" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Metal Grid & Roller -->
  <g transform="translate(275, 70)">
    <text x="145" y="25" font-size="13" font-weight="bold" fill="#0f172a">metal</text>
    <text x="145" y="40" font-size="13" font-weight="bold" fill="#0f172a">grid</text>
    <line x1="140" y1="35" x2="108" y2="52" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="25,45 115,45 95,75 5,75" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <line x1="45" y1="45" x2="25" y2="75" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="65" y1="45" x2="45" y2="75" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="85" y1="45" x2="65" y2="75" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="15" y1="60" x2="105" y2="60" stroke="#0f172a" stroke-width="1.2"/>
    <circle cx="45" cy="84" r="2.5" fill="#334155"/>
    <circle cx="62" cy="88" r="2.5" fill="#334155"/>
    <circle cx="78" cy="83" r="2.5" fill="#334155"/>
    <rect x="5" y="95" width="145" height="18" rx="9" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="20" cy="104" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="60" cy="104" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="100" cy="104" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="135" cy="104" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <text x="78" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">roller</text>
  </g>

  <!-- Stage 3: Sand + Water Funnel -->
  <g transform="translate(445, 55)">
    <text x="45" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">sand + water</text>
    <polygon points="35,22 55,22 55,48 65,48 45,72 25,48 35,48" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M 45 95 Q 85 95 110 75" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 45 95 Q 85 95 110 120" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="85" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">or</text>
  </g>

  <!-- Stage 4: Wire Cutter & Mould -->
  <g transform="translate(565, 65)">
    <rect x="0" y="20" width="75" height="26" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <rect x="75" y="24" width="38" height="20" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <line x1="94" y1="14" x2="94" y2="50" stroke="#0f172a" stroke-width="2"/>
    <text x="118" y="28" font-size="13" font-weight="bold" fill="#0f172a">wire cutter</text>
    <rect x="130" y="45" width="32" height="16" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="168" y="45" width="32" height="16" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
    <text x="195" y="40" font-size="13" font-weight="bold" fill="#0f172a">bricks</text>

    <rect x="15" y="75" width="55" height="24" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <rect x="23" y="80" width="39" height="14" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="85" y="78" width="42" height="18" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
    <text x="42" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">mould</text>
  </g>

  <!-- Arrow Down to Drying Oven -->
  <line x1="665" y1="190" x2="665" y2="235" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 5: Drying Oven -->
  <g transform="translate(575, 245)">
    <text x="90" y="15" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">drying oven</text>
    <rect x="10" y="24" width="160" height="72" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="25" y="36" width="55" height="20" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="95" y="36" width="55" height="20" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="25" y="64" width="55" height="20" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="95" y="64" width="55" height="20" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
    <text x="90" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">24 - 48 hrs</text>
  </g>

  <!-- Arrow from Drying Oven left to Kiln -->
  <line x1="575" y1="305" x2="495" y2="305" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 6 & 7: Cooling Chamber + Kiln -->
  <g transform="translate(75, 240)">
    <text x="65" y="10" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">cooling</text>
    <text x="65" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">chamber</text>
    <text x="205" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">kiln</text>
    <text x="340" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">kiln</text>

    <rect x="0" y="32" width="135" height="72" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="135" y="32" width="135" height="72" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="270" y="32" width="140" height="72" fill="#94a3b8" stroke="#0f172a" stroke-width="2.5"/>

    <rect x="25" y="50" width="85" height="42" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="160" y="50" width="85" height="42" fill="#475569" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="295" y="50" width="85" height="42" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>

    <text x="340" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">moderate</text>
    <text x="340" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">200°C - 980°C</text>

    <line x1="285" y1="120" x2="250" y2="120" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="202" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">high</text>
    <text x="202" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">870°C - 1300°C</text>

    <line x1="150" y1="120" x2="115" y2="120" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="65" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">48 - 72 hrs</text>
  </g>

  <!-- Curved Arrow from Cooling Chamber down to Packaging -->
  <path d="M 125 375 Q 125 445 190 455" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 8: Packaging Pallet -->
  <g transform="translate(205, 400)">
    <rect x="10" y="0" width="95" height="75" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
    <line x1="10" y1="25" x2="105" y2="25" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="10" y1="50" x2="105" y2="50" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="42" y1="0" x2="42" y2="75" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="74" y1="0" x2="74" y2="75" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="0" y="75" width="115" height="12" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <text x="57" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">packaging</text>
  </g>

  <!-- Arrow from Packaging to Delivery -->
  <line x1="335" y1="450" x2="425" y2="450" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 9: Delivery Lorry -->
  <g transform="translate(440, 405)">
    <rect x="0" y="0" width="155" height="65" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
    <text x="77" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">delivery</text>
    <polygon points="155,18 195,18 210,40 210,65 155,65" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="165,24 190,24 202,40 165,40" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="30" cy="68" r="12" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <circle cx="30" cy="68" r="5" fill="#f8fafc"/>
    <circle cx="62" cy="68" r="12" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <circle cx="62" cy="68" r="5" fill="#f8fafc"/>
    <circle cx="182" cy="68" r="12" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <circle cx="182" cy="68" r="5" fill="#f8fafc"/>
  </g>

  <!-- Footnote -->
  <text x="45" y="542" font-size="12" font-weight="bold" fill="#334155">
    *Clay: type of sticky earth that is used for making bricks, pots, etc.
  </text>
</svg>
