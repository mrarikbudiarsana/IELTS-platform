<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" height="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="500" fill="#ffffff"/>
  
  <!-- Y-Axis Title -->
  <g transform="translate(32, 240) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Men and women in further education</text>
    <text x="0" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">(thousands)</text>
  </g>

  <!-- Chart Area -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3">
    <line x1="110" y1="50" x2="710" y2="50"/>
    <line x1="110" y1="106.7" x2="710" y2="106.7"/>
    <line x1="110" y1="163.3" x2="710" y2="163.3"/>
    <line x1="110" y1="220" x2="710" y2="220"/>
    <line x1="110" y1="276.7" x2="710" y2="276.7"/>
    <line x1="110" y1="333.3" x2="710" y2="333.3"/>
  </g>

  <!-- Y-Axis Labels & Ticks -->
  <g font-size="13" font-weight="bold" fill="#0f172a" text-anchor="end">
    <text x="100" y="55">1200</text>
    <text x="100" y="111.7">1000</text>
    <text x="100" y="168.3">800</text>
    <text x="100" y="225">600</text>
    <text x="100" y="281.7">400</text>
    <text x="100" y="338.3">200</text>
    <text x="100" y="395">0</text>
  </g>

  <g stroke="#0f172a" stroke-width="2.5">
    <line x1="104" y1="50" x2="110" y2="50"/>
    <line x1="104" y1="106.7" x2="110" y2="106.7"/>
    <line x1="104" y1="163.3" x2="110" y2="163.3"/>
    <line x1="104" y1="220" x2="110" y2="220"/>
    <line x1="104" y1="276.7" x2="110" y2="276.7"/>
    <line x1="104" y1="333.3" x2="110" y2="333.3"/>
    <line x1="104" y1="390" x2="110" y2="390"/>
  </g>

  <!-- Group Headers -->
  <text x="255" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Male</text>
  <text x="555" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Female</text>

  <!-- Center Vertical Dashed Divider -->
  <line x1="410" y1="30" x2="410" y2="390" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8,5"/>

  <!-- MALE BARS -->
  <rect x="130" y="106.7" width="38" height="283.3" fill="#8c8c8c" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="168" y="361.7" width="38" height="28.3" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/>

  <rect x="225" y="149.2" width="38" height="240.8" fill="#8c8c8c" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="263" y="347.5" width="38" height="42.5" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/>

  <rect x="320" y="135" width="38" height="255" fill="#8c8c8c" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="358" y="319.2" width="38" height="70.8" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/>

  <!-- FEMALE BARS -->
  <rect x="430" y="177.5" width="38" height="212.5" fill="#8c8c8c" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="468" y="373" width="38" height="17" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/>

  <rect x="525" y="157.7" width="38" height="232.3" fill="#8c8c8c" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="563" y="327.7" width="38" height="62.3" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/>

  <rect x="620" y="78.3" width="38" height="311.7" fill="#8c8c8c" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="658" y="319.2" width="38" height="70.8" fill="#0f172a" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Main Axes -->
  <line x1="110" y1="50" x2="110" y2="390" stroke="#0f172a" stroke-width="3"/>
  <line x1="110" y1="390" x2="715" y2="390" stroke="#0f172a" stroke-width="3"/>

  <!-- X-Axis Period Labels -->
  <g font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="168" y="410">1970/71</text>
    <text x="263" y="410">1980/81</text>
    <text x="358" y="410">1990/91</text>
    <text x="468" y="410">1970/71</text>
    <text x="563" y="410">1980/81</text>
    <text x="658" y="410">1990/91</text>
  </g>

  <!-- Legend -->
  <g transform="translate(360, 430)">
    <rect x="0" y="0" width="18" height="16" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
    <text x="26" y="13" font-size="14" font-weight="bold" fill="#0f172a">Full-time education</text>
    <rect x="0" y="26" width="18" height="16" fill="#8c8c8c" stroke="#0f172a" stroke-width="2"/>
    <text x="26" y="39" font-size="14" font-weight="bold" fill="#0f172a">Part-time education</text>
  </g>
</svg>
